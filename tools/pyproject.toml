[project]
name = "welleng"
version = "0.0.0"
description = "Command line for the Well-Engineering development environment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
welleng = "welleng.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/welleng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
