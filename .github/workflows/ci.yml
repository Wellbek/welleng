name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: scripts/install-gitleaks.sh "$RUNNER_TEMP/bin"
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --verbose \
            --config .gitleaks.toml .

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        run: scripts/check-hygiene.sh

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in scripts/*.sh .githooks/pre-commit; do
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck scripts/*.sh .githooks/pre-commit
