name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: scripts/install-gitleaks.sh "$RUNNER_TEMP/bin"
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --verbose \
            --config .gitleaks.toml .

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        run: scripts/check-hygiene.sh

  packages:
    name: Package ids (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            prepare: apt-get update -qq && apt-get install -y -qq python3
            manager: apt
          - distro: fedora
            image: fedora:latest
            prepare: dnf install -y -q python3
            manager: dnf
          - distro: arch
            image: archlinux:latest
            prepare: pacman -Syu --noconfirm python
            manager: pacman
    container: ${{ matrix.image }}
    steps:
      - name: Install Python
        run: ${{ matrix.prepare }}
      - uses: actions/checkout@v4
      - name: Check package ids
        run: python3 -I scripts/check-packages.py ${{ matrix.manager }}

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in scripts/*.sh bootstrap/*.sh .githooks/pre-commit tests/*.sh tests/*/*.sh; do
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck scripts/*.sh bootstrap/*.sh .githooks/pre-commit tests/*.sh tests/*/*.sh

  regression:
    name: Regression (Arch container)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed chezmoi git tmux zsh python uv shellcheck
      - uses: actions/checkout@v4
      - name: Allow git in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Security policy checks
        run: tests/security/static.sh
      - name: Python unit tests
        run: cd tools && uv run --quiet pytest -q
      - name: End-to-end home test
        run: tests/e2e/home.sh

  bootstrap:
    name: Bootstrap (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, arch]
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify in a clean container
        run: scripts/distro-container.sh ${{ matrix.distro }} tests/e2e/bootstrap.sh
