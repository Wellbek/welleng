name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: scripts/install-gitleaks.sh "$RUNNER_TEMP/bin"
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --verbose \
            --config .gitleaks.toml .

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        run: scripts/check-hygiene.sh

  packages:
    name: Package ids (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            prepare: apt-get update -qq && apt-get install -y -qq python3
            manager: apt
          - distro: fedora
            image: fedora:latest
            prepare: dnf install -y -q python3
            manager: dnf
          - distro: arch
            image: archlinux:latest
            prepare: pacman -Syu --noconfirm python
            manager: pacman
    container: ${{ matrix.image }}
    steps:
      - name: Install Python
        run: ${{ matrix.prepare }}
      - uses: actions/checkout@v4
      - name: Check package ids
        run: python3 -I scripts/check-packages.py ${{ matrix.manager }}

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in scripts/*.sh bootstrap/*.sh .githooks/pre-commit .githooks/commit-msg tests/*.sh tests/*/*.sh .claude/skills/*/scripts/*.sh; do
            bash -n "$f"
          done
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in "bootstrap/install.ps1", "home/Documents/PowerShell/welleng.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { "${f}: $($_.Message)" }; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: PowerShell profile behaviour
        shell: pwsh
        run: ./tests/e2e/powershell-profile.ps1
      - name: WezTerm config syntax
        run: |
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p home/dot_config/wezterm/wezterm.lua
      - name: ShellCheck
        run: shellcheck scripts/*.sh bootstrap/*.sh .githooks/pre-commit .githooks/commit-msg tests/*.sh tests/*/*.sh .claude/skills/*/scripts/*.sh

  regression:
    name: Regression (Arch container)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed chezmoi git tmux zsh python uv shellcheck openssh diffutils starship zoxide fzf fd
      - uses: actions/checkout@v4
      - name: Allow git in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Security policy checks
        run: tests/security/static.sh
      - name: Python unit tests
        run: cd tools && uv run --quiet pytest -q
      - name: End-to-end home test
        run: tests/e2e/home.sh
      - name: Wire-in end-to-end test
        run: tests/e2e/wire-in.sh

  bootstrap:
    name: Bootstrap (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, arch]
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify in a clean container
        run: scripts/distro-container.sh ${{ matrix.distro }} tests/e2e/bootstrap.sh

  distro:
    name: Home and Python tests (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap, then run the home and Python tests in a clean container
        run: scripts/distro-container.sh ${{ matrix.distro }} tests/e2e/distro.sh

  windows:
    # Native Windows is best effort (ADR 0004), so a failure here is shown but does not fail the build.
    name: Windows (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Installer dry run
        shell: pwsh
        run: ./bootstrap/install.ps1 -DryRun
      - name: welleng doctor and its tests
        shell: pwsh
        run: |
          python -m pip install --quiet --editable ./tools pytest
          python -m welleng.cli doctor --packages packages/packages.toml
          # Exit code 1 means a mandatory tool is missing on the runner, which is expected, anything higher is a crash.
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          python -m pytest -q tools/tests/test_doctor.py tools/tests/test_plan.py
