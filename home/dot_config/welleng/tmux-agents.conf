# Number of Claude Code sessions waiting for you, shown at the end of the status line.
# Loaded from ~/.tmux.conf with `source-file -q`, so a missing file or a missing welleng is harmless.
set -ag status-right '#(n=$(welleng agents --count 2>/dev/null); case "$n" in ""|0|"?") ;; *) printf " waiting:%s" "$n" ;; esac)'
