# Managed by chezmoi, edit it in the welleng repository.
# kitty is only the skin, tmux owns sessions and splits (ADR 0003).
# Opt in with one line at the end of ~/.config/kitty/kitty.conf:
#   include ~/.config/welleng/kitty/welleng.conf
# Later lines in kitty.conf win over this file when it is included first, so your own settings stay in charge.

shell_integration enabled
scrollback_lines 20000
copy_on_select clipboard
confirm_os_window_close 0
enable_audio_bell no
window_padding_width 4
remember_window_size yes

# The tmux prefix is M-o and several tmux keys use Alt, so Alt must reach the terminal program on macOS.
macos_option_as_alt yes

# Let programs in tmux set the clipboard (OSC 52), never read it.
clipboard_control write-clipboard write-primary

# Optional, uncomment to open every new kitty window in the welleng tmux session:
# shell tmux new -A -s welleng
