# Well-Engineering prompt: short, one line, shows what matters in a multi-repository workflow.
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$branch]($style) "
style = "purple"

[git_status]
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
