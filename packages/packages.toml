# Logical package name -> package id per package manager.
#
# tier:     mandatory | recommended | optional
# <manager> the package id for that manager, a missing key means "not available there"
# fallback  how to install it when the manager has no package, see the installer
# note      anything a human needs to know
#
# Verification status of the ids, see CHECKLIST.md:
#   pacman, apt, dnf   checked by scripts/check-packages.py inside containers
#   brew, winget, scoop   written from knowledge of the upstream names, not yet checked

[[package]]
name = "git"
tier = "mandatory"
pacman = "git"
apt = "git"
dnf = "git"
brew = "git"
winget = "Git.Git"
scoop = "git"

[[package]]
name = "chezmoi"
tier = "mandatory"
pacman = "chezmoi"
dnf = "chezmoi"
brew = "chezmoi"
winget = "twpayne.chezmoi"
scoop = "chezmoi"
fallback = "https://get.chezmoi.io"

[[package]]
name = "uv"
tier = "mandatory"
pacman = "uv"
dnf = "uv"
brew = "uv"
winget = "astral-sh.uv"
scoop = "uv"
fallback = "https://astral.sh/uv/install.sh"

[[package]]
name = "tmux"
tier = "mandatory"
pacman = "tmux"
apt = "tmux"
dnf = "tmux"
brew = "tmux"
note = "No native Windows build, see docs/platforms.md"

